<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今日の言葉</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3B3FB8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#ECEDF3;--ink:#1E2233;--sub:#5B6076;--line:#CFD3E2;--accent:#3B3FB8;--mark:#F6D84C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
#date{margin:0;color:var(--sub);font-size:.9rem}
h1{margin:.4rem 0 1.5rem;font:700 clamp(2.4rem,11vw,3.6rem)/1.35 "Hiragino Mincho ProN","Yu Mincho",serif;word-break:keep-all;overflow-wrap:anywhere}
h1 span{background:linear-gradient(transparent 60%,var(--mark) 60%);padding:0 .1em}
section{border-top:1px solid var(--line);padding:1.1rem 0 1.3rem}
h2{margin:0 0 .5rem;font-size:.95rem;color:var(--sub);font-weight:700}
p{margin:0 0 .6rem}
a{color:var(--accent)}
#meaning{white-space:pre-line}
.chip{background:#fff;color:var(--accent);border:1px solid var(--accent);padding:.35rem .8rem;margin:0 .4rem .5rem 0;border-radius:999px;font-weight:400}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:700}
.note{color:var(--sub);font-size:.85rem}
textarea{width:100%;min-height:9rem;padding:.8rem;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit;resize:vertical}
button{font:inherit;font-weight:700;padding:.65rem 1.1rem;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
button.off{background:#fff;color:var(--accent);border:1px solid var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details{border-bottom:1px solid var(--line);padding:.5rem 0}
summary{cursor:pointer}
details p{white-space:pre-wrap;margin:.4rem 0 0}
ul{list-style:none;margin:0;padding:0}
</style>
</head>
<body>
<main>
  <p id="date"></p>
  <h1><span id="word">…</span></h1>
  <p class="note" id="yomi" style="margin:-1rem 0 1.2rem"></p>

  <section>
    <h2>意味</h2>
    <p id="meaning">読み込み中…</p>
    <p class="note"><a id="wl" target="_blank" rel="noopener">元の項目を開く</a></p>
  </section>

  <section>
    <h2>この言葉の印象</h2>
    <p id="tags"></p>
    <textarea id="memo" placeholder="この言葉に、どんな印象がありますか？ 知らない言葉なら、字面や響きの印象でも。入力すると自動で保存されます。" aria-label="今日の言葉の印象"></textarea>
    <p class="note" id="saved" aria-live="polite"></p>
  </section>

  <section>
    <h2>これまでのメモ</h2>
    <ul id="hist"></ul>
    <p class="note" id="empty">印象を残すと、ここに並びます。</p>
  </section>

  <section>
    <h2>通知</h2>
    <p><button id="bell" type="button">毎朝10時に通知する</button></p>
    <p class="note" id="nmsg"></p>
  </section>
</main>

<script>
let WORDS=[];
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
const now=new Date(), key=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
let S={};try{S=JSON.parse(localStorage.getItem('dw')||'{}')}catch{}
S.days=S.days||{};
const save=()=>localStorage.setItem('dw',JSON.stringify(S));

// 日付から言葉を決める：語数と互いに素な歩幅で進むので、一巡するまで重複せず、同じ日は同じ言葉
function pick(){
  const n=Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/864e5),N=WORDS.length;
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  let step=100003;while(gcd(step,N)!==1)step+=2;
  const [word,yomi]=WORDS[(n*step)%N].split('\t');
  return {word,yomi:yomi||''};
}
function cut(t,n){t=t.trim();if(t.length<=n)return t;const i=t.lastIndexOf('。',n);return i>30?t.slice(0,i+1):t.slice(0,n)+'…'}

// 意味：Wiktionary（日本語版）を優先し、なければWikipedia
const wt=x=>x.replace(/\{\{[^{}]*\}\}/g,'').replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,'$1').replace(/'{2,}/g,'').replace(/<[^>]+>/g,'').trim();
async function info(w){
  const e=encodeURIComponent(w);
  try{
    const r=await fetch(`https://ja.wiktionary.org/w/api.php?origin=*&format=json&redirects=1&action=parse&prop=wikitext&page=${e}`).then(r=>r.json());
    const t=(r.parse&&r.parse.wikitext['*'])||'',i=t.indexOf('==日本語==');
    const sec=i<0?'':t.slice(i+7).split(/\n==[^=]/)[0],defs=[];
    for(const l of sec.split('\n')){const m=l.match(/^#\s+(.+)/);if(m){const d=wt(m[1]);if(d.length>1)defs.push(d)}}
    if(defs.length)return {meaning:defs.slice(0,4).map((d,i)=>defs.length>1?`${i+1}. ${d}`:d).join('\n'),src:'Wiktionary',url:`https://ja.wiktionary.org/wiki/${e}`};
  }catch{}
  const s=await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${e}`).then(r=>r.json());
  if(s.extract&&s.type!=='disambiguation')return {meaning:cut(s.extract,300),src:'Wikipedia',url:s.content_urls.desktop.page};
  return {};
}

function draw(){
  const d=S.days[key],e=encodeURIComponent(d.word);
  $('date').textContent=now.toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'});
  $('word').textContent=d.word;$('yomi').textContent=d.yomi||'';
  $('meaning').textContent=d.meaning||(d.none?'WiktionaryにもWikipediaにも項目がありませんでした。字面や響きの印象でも、メモできます。':(d.err?'取得できませんでした。通信状態を確認して、開き直してください。':'読み込み中…'));
  $('wl').href=d.url||`https://ja.wiktionary.org/w/index.php?search=${e}`;
  $('wl').textContent=d.src?`${d.src}で開く`:'Wiktionaryで検索する';
}

const TAGS=['好き','苦手','懐かしい','気になる','初めて知った'];
function tags(){
  const box=$('tags');box.textContent='';
  for(const t of TAGS){
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',S.days[key].tag===t);
    b.onclick=()=>{const d=S.days[key];d.tag=d.tag===t?'':t;save();tags();history()};box.append(b);
  }
}

function history(){
  const ul=$('hist');ul.textContent='';
  const ks=Object.keys(S.days).filter(k=>k!==key&&((S.days[k].memo||'').trim()||S.days[k].tag)).sort().reverse();
  $('empty').hidden=ks.length>0;
  for(const k of ks){
    const li=document.createElement('li'),dt=document.createElement('details'),sm=document.createElement('summary'),p=document.createElement('p');
    sm.textContent=`${+k.slice(5,7)}/${+k.slice(8)}　${S.days[k].word}${S.days[k].tag?'　［'+S.days[k].tag+'］':''}`;p.textContent=S.days[k].memo||'（メモなし）';
    dt.append(sm,p);li.append(dt);ul.append(li);
  }
}

// メモ：入力のたびに端末内へ自動保存
let timer;
$('memo').addEventListener('input',e=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{S.days[key].memo=e.target.value;save();$('saved').textContent='保存しました';history()},500);
});

// 通知
let fireTimer;
const canNotify='Notification' in window && 'serviceWorker' in navigator;
function bell(){
  const on=S.notify&&canNotify&&Notification.permission==='granted';
  $('bell').textContent=on?'通知をオフにする':'毎朝10時に通知する';
  $('bell').className=on?'off':'';
  $('nmsg').textContent=!canNotify
    ?'iPhoneでは、共有ボタンから「ホーム画面に追加」し、ホーム画面のアイコンから開くと通知を設定できます。'
    :'アプリを開いている間は10時ちょうどに届きます。閉じている間は、Android版Chromeでのみ1日1回（時刻は端末任せ）届きます。';
}
async function toast(){
  const reg=await navigator.serviceWorker.ready,d=S.days[key];
  reg.showNotification('今日の言葉：'+d.word,{body:cut(d.meaning||'タップして意味と議論を見る',60),icon:'icon-192.png',tag:'daily'});
}
function schedule(){
  clearTimeout(fireTimer);
  if(!(S.notify&&canNotify&&Notification.permission==='granted'))return;
  const t=new Date();t.setHours(10,0,0,0);
  if(now<t)fireTimer=setTimeout(toast,t-now);
}
$('bell').addEventListener('click',async()=>{
  if(!canNotify){bell();return}
  if(S.notify){S.notify=false;save();bell();schedule();return}
  const p=await Notification.requestPermission();
  if(p!=='granted'){$('nmsg').textContent='通知が許可されていません。ブラウザまたは端末の設定で、このアプリの通知を許可してください。';return}
  S.notify=true;save();
  try{const reg=await navigator.serviceWorker.ready;await reg.periodicSync.register('daily-word',{minInterval:864e5})}catch{}
  bell();schedule();
});

async function init(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  bell();
  let d=S.days[key];
  if(!d){
    try{WORDS=(await (await fetch('words.txt')).text()).split('\n').filter(Boolean)}
    catch{$('meaning').textContent='語彙リスト(words.txt)を読み込めませんでした。通信状態を確認して、開き直してください。';return}
    d=S.days[key]=pick();save();
  }
  $('memo').value=d.memo||'';
  tags();draw();history();schedule();
  if(!d.meaning&&!d.none){
    try{const r=await info(d.word);if(r.meaning)Object.assign(d,r);else d.none=1;delete d.err;save()}catch{d.err=1}
    draw();
  }
}
init();
</script>
</body>
</html>
